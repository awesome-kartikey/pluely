name: "Build Windows Executable"

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Frontend Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Frontend
        run: npm run build

      - name: Build Windows Executable & Bundle
        run: npx tauri build
        env:
          CI: true

      - name: Prepare Standalone Executable
        shell: bash
        run: |
          if [ -f "src-tauri/target/release/pluely.exe" ] && [ ! -f "src-tauri/target/release/Kartikey-Pluely.exe" ]; then
            cp "src-tauri/target/release/pluely.exe" "src-tauri/target/release/Kartikey-Pluely.exe"
          fi

      - name: Upload Windows Executable & Installer
        uses: actions/upload-artifact@v4
        with:
          name: Kartikey-Pluely-Windows-x64
          path: |
            src-tauri/target/release/Kartikey-Pluely.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
